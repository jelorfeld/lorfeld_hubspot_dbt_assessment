name: 'rental_analytics'
version: '1.0.0'
profile: 'rental_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  rental_analytics:
    staging:
      +materialized: view
      +tags: ['staging']
    intermediate:
      +materialized: view
      +tags: ['intermediate']
    marts:
      +materialized: table
      +tags: ['marts']

seeds:
  rental_analytics:
    raw:
      listings:
        +column_types:
          PRICE: varchar           # '$1,125.00' - currency symbol and commas
      calendar:
        +column_types:
          AVAILABLE: varchar       # 't'/'f' flags, mapped to is_available
          RESERVATION_ID: varchar  # contains literal 'NULL' strings
          PRICE: varchar           # cleaned the same way as listings.PRICEdb