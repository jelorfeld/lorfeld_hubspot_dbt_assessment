version: 2

models:
  - name: int_listing_amenity_history
    description: Effective-dated amenity history for each listing. Each row represents the amenity configuration active from valid_from_date up to, but not including, valid_to_date. A null valid_to_date indicates the current amenity configuration.

  - name: listing_id
    description: Identifier for the listing.
    tests:
          - not_null
          - relationships:
              to: ref('stg_listings')
              field: listing_id

  - name: valid_from_date
    description: First date on which this amenity configuration is active.
    tests:
      - not_null

  - name: valid_to_date
    description: Exclusive end date for this amenity configuration.

  - name: amenities
    description: JSON array of amenities active during this effective period.
    tests:
      - not_null

  - name: has_air_conditioning
    description: Whether the listing had air conditioning during this period.
    tests:
      - accepted_values:
          values: [true, false]

  - name: has_lockbox
    description: Whether the listing had a lockbox during this period.
    tests:
      - accepted_values:
          values: [true, false]

  - name: has_first_aid_kit
    description: Whether the listing had a first aid kit during this period.
    tests:
      - accepted_values:
          values: [true, false]