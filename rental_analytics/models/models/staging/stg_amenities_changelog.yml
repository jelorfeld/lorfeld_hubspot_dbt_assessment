version: 2

models:
  - name: stg_amenities_changelog
    description: >
      Cleaned amenity change events for each listing.
      Each row represents one amenity snapshot at a point in time.

    columns:
      - name: listing_id
        description: Identifier for the listing.
        tests:
          - not_null
          - relationships:
              to: ref('stg_listings')
              field: listing_id

      - name: amenities_changed_at
        description: Timestamp when the amenity configuration changed.
        tests:
          - not_null

      - name: amenities
        description: JSON array of amenities active after the change.
        tests:
          - not_null