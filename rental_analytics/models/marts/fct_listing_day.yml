version: 2

models:
  - name: fct_listing_day
    description: >
      Daily listing-level reporting mart. The grain is one row per listing
      per calendar date. Every calendar row is kept, including rows for
      listings missing from stg_listings (is_orphan_listing = true), so
      revenue and occupancy totals reconcile to the source calendar. Listing
      attributes (name, host, neighborhood, property details) are null on
      orphan rows; calendar and amenity columns are still populated.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_id
              - calendar_date

    columns:
      - name: listing_id
        description: Identifier for the listing.
        data_tests:
          - not_null

      - name: calendar_date
        description: Calendar date represented by the row.
        data_tests:
          - not_null

      - name: listing_name
        description: Display name of the listing.

      - name: host_id
        description: Identifier for the listing host.

      - name: neighborhood
        description: Neighborhood where the listing is located.

      - name: property_type
        description: Type of property.

      - name: room_type
        description: Type of room.

      - name: accommodates
        description: Number of guests the listing accommodates.

      - name: bedrooms
        description: Number of bedrooms.

      - name: beds
        description: Number of beds.

      - name: is_orphan_listing
        description: >
          True when the calendar row has no matching listing in stg_listings,
          so listing attributes are null. Revenue, occupancy, price and amenity
          columns are still valid. Filter on this only when the analysis needs
          listing attributes; do not use it as a blanket exclusion. See the
          data quality section of the README.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: nightly_price
        description: Nightly price for the listing on the calendar date.
        data_tests:
          - not_null

      - name: is_available
        description: Whether the listing was available on the calendar date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: reservation_id
        description: Reservation identifier when the date was reserved.

      - name: is_occupied
        description: Whether the listing had a reservation on the date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: nightly_revenue
        description: Nightly price when occupied, otherwise zero.
        data_tests:
          - not_null

      - name: minimum_nights
        description: Minimum consecutive-night requirement.

      - name: maximum_nights
        description: Maximum consecutive-night limit.

      - name: amenities
        description: JSON array of amenities active on the date.

      - name: amenities_effective_from
        description: Date when the active amenity configuration began.

      - name: has_air_conditioning
        description: Whether air conditioning was available.

      - name: has_lockbox
        description: Whether a lockbox was available.

      - name: has_first_aid_kit
        description: Whether a first aid kit was available.
